<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Publicar música | Máquina de Rock</title>
    <link
      rel="icon"
      type="image/png"
      href="/images/logo-rock-machine.png?v=20261019"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Rajdhani", "sans-serif"],
            },
            boxShadow: {
              gold: "0 0 25px rgba(192,168,120,0.25), 0 0 60px rgba(128,48,64,0.12)",
              card: "0 10px 40px rgba(0,0,0,0.6)",
            },
            colors: {
              rm: {
                black: "#080808",
                graphite: "#171717",
                blue: "#607090",
                red: "#803040",
                gold: "#C0A878",
                vinyl: "#505050",
                ivory: "#E8E0D0",
              },
            },
          },
        },
      };
    </script>
    <style>
      :root {
        /* Cores principais */
        --rm-black: #080808;
        --rm-graphite: #171717;
        --rm-blue: #607090;
        --rm-red: #803040;
        --rm-gold: #C0A878;
        --rm-vinyl: #505050;
        --rm-ivory: #E8E0D0;
      }
      body {
        background: radial-gradient(circle at top, #201d19 0%, #121110 40%, var(--rm-black) 100%);
        color: var(--rm-ivory);
      }
    </style>
  </head>
  <body class="min-h-screen font-sans antialiased">
    <main
      class="mx-auto flex min-h-screen w-full max-w-2xl items-center px-4 py-10 sm:px-6"
    >
      <section
        class="w-full rounded-3xl border border-[var(--rm-vinyl)] bg-[var(--rm-graphite)]/90 p-6 shadow-card backdrop-blur-xl sm:p-10"
      >
        <div class="mb-4 flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <img src="/images/logo-rock-machine.png?v=20261019" alt="Rock Machine" class="h-7 w-7 object-contain" />
            <p
              class="font-display text-xs font-bold uppercase tracking-[0.32em] text-[var(--rm-gold)]"
            >
              Rock Machine
            </p>
          </div>
          <a
            href="/studio"
            class="text-xs font-semibold text-stone-400 hover:text-[var(--rm-gold)] transition"
          >
            ← Voltar ao Studio
          </a>
        </div>
        <h1
          class="mt-3 font-display text-4xl font-bold tracking-tight text-[var(--rm-ivory)] sm:text-5xl"
        >
          Publicar uma música
        </h1>
        <p class="mt-3 leading-6 text-stone-300">
          Envie o WAV final e informe os créditos. A música ficará preparada
          para aparecer na playlist pública.
        </p>
        <form id="publicationForm" class="mt-8 space-y-5">
          <label class="block">
            <span class="mb-2 block text-sm font-semibold text-stone-200"
              >Nome da música</span
            >
            <input
              id="nome"
              name="nome"
              type="text"
              required
              maxlength="120"
              autocomplete="off"
              placeholder="Ex.: Meu remix de rock"
              class="w-full rounded-xl border border-[var(--rm-vinyl)] bg-[var(--rm-black)] px-4 py-3 text-[var(--rm-ivory)] outline-none transition placeholder:text-stone-500 focus:border-[var(--rm-gold)] focus:ring-2 focus:ring-[var(--rm-gold)]/20"
            />
          </label>
          <label class="block">
            <span class="mb-2 block text-sm font-semibold text-stone-200"
              >Nome do autor</span
            >
            <input
              id="autor"
              name="autor"
              type="text"
              required
              maxlength="120"
              autocomplete="name"
              placeholder="Ex.: Ana Silva"
              class="w-full rounded-xl border border-[var(--rm-vinyl)] bg-[var(--rm-black)] px-4 py-3 text-[var(--rm-ivory)] outline-none transition placeholder:text-stone-500 focus:border-[var(--rm-gold)] focus:ring-2 focus:ring-[var(--rm-gold)]/20"
            />
          </label>

          <div
            class="rounded-xl border border-[var(--rm-gold)]/30 bg-[var(--rm-gold)]/5 px-4 py-3"
          >
            <p class="font-display text-sm font-bold uppercase tracking-wider text-[var(--rm-gold)]">
              🎵 Sua composição está pronta para publicação
            </p>
            <p class="mt-1 text-sm text-stone-400">
              O áudio da sessão finalizada será enviado automaticamente junto
              com os dados da sua música.
            </p>
          </div>
          <p
            id="status"
            class="hidden rounded-xl px-4 py-3 text-sm"
            role="status"
            aria-live="polite"
          ></p>
          <button
            id="submitButton"
            type="submit"
            class="w-full rounded-xl bg-gradient-to-r from-[#d8c496] via-[var(--rm-gold)] to-[#a89060] px-5 py-3.5 font-display text-base font-bold uppercase tracking-wider text-[var(--rm-black)] shadow-[0_0_20px_rgba(192,168,120,0.3)] transition hover:shadow-[0_0_30px_rgba(192,168,120,0.5)] hover:scale-[1.01] disabled:cursor-not-allowed disabled:opacity-50"
          >
            Salvar música
          </button>
        </form>
      </section>
    </main>

    <script>
      const form = document.getElementById("publicationForm");
      const status = document.getElementById("status");
      const submitButton = document.getElementById("submitButton");

      // Serviço local que controla a máquina e a sessão.
      const API_LOCAL = "http://127.0.0.1:8001";

      // URL da playlist: se estiver testando localmente, redireciona para a porta 8000; em produção, vai para o Render.
      const URL_PLAYLIST_PUBLICA =
        window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
          ? "http://127.0.0.1:8000/playlist"
          : "https://rock-machine.onrender.com/playlist";

      function showStatus(message, type) {
        status.textContent = message;
        status.className =
          "rounded-xl px-4 py-3 text-sm border font-medium " +
          (type === "success"
            ? "border-[var(--rm-gold)]/50 bg-[var(--rm-gold)]/15 text-[var(--rm-ivory)]"
            : "border-[var(--rm-red)]/50 bg-[var(--rm-red)]/20 text-[#f5a0b0]");
      }

      async function carregarSessao() {
        try {
          const response = await fetch(`${API_LOCAL}/sessao/finalizada`);

          const dados = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(
              dados.detail || "Nenhuma sessão finalizada foi encontrada.",
            );
          }

          if (dados.publicada) {
            throw new Error("Esta sessão já foi publicada.");
          }

          showStatus(
            "Sessão finalizada. Preencha os créditos para publicar.",
            "success",
          );
        } catch (error) {
          showStatus(
            error.message || "Não foi possível verificar a sessão.",
            "error",
          );

          submitButton.disabled = true;
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const nome = document.getElementById("nome").value.trim();
        const autor = document.getElementById("autor").value.trim();

        if (!nome || !autor) {
          showStatus("Preencha o nome da música e o autor.", "error");
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Publicando música...";
        status.classList.add("hidden");

        try {
          // Envia nome e autor para o serviço local.
          // O serviço local anexa o WAV e encaminha tudo ao Render.
          const response = await fetch(`${API_LOCAL}/sessao/publicar`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ nome, autor }),
          });

          const resultado = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(
              resultado.detail || "Não foi possível publicar a música.",
            );
          }

          showStatus("Música publicada! Abrindo a playlist...", "success");

          // Só redireciona depois de confirmar o sucesso da publicação.
          window.location.assign(URL_PLAYLIST_PUBLICA);
        } catch (error) {
          showStatus(error.message || "Erro ao publicar a música.", "error");

          submitButton.disabled = false;
          submitButton.textContent = "Salvar música";
        }
      });

      carregarSessao();
    </script>
  </body>
</html>
